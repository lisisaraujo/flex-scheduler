services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flexscheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@postgres:5432/flexscheduler
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

# The Next.js frontend keeps running natively via `npm run dev` (point
# NEXT_PUBLIC_API_URL at http://localhost:8000) — no need to containerize it
# for local development. `docker compose up` here just gives you Postgres + the API.

volumes:
  pgdata:
